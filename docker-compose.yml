services:
  db:
    image: postgres:17
    container_name: fraud_pg
    environment:
      POSTGRES_USER: chayma
      POSTGRES_PASSWORD: chayma
      POSTGRES_DB: fraud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
      - ./sql:/sql
volumes:
  pgdata: